<style id="trycss">
/* 試玩頁：樣式直接用 HAECHU 本體的（載入時從 ../app.css 拿），這裡只補試玩自己的東西 */
html:not(.ready) body{opacity:0}html.ready body{opacity:1;transition:opacity .2s}
.tz-pill{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--violet-soft,#F1E8FF);color:var(--violet,#8843FB)}
html[data-theme="dark"] .tz-pill{background:rgba(167,139,250,.18);color:#C4B5FD}
.tz-hint{display:flex;gap:10px;align-items:flex-start;margin:4px 0 16px;padding:12px 14px;border-radius:16px;background:var(--violet-soft,#F1E8FF);color:var(--ink,#1D1A24);font-size:13px;line-height:1.6}
.tz-hint b{color:var(--violet,#8843FB)}html[data-theme="dark"] .tz-hint{background:rgba(167,139,250,.12)}html[data-theme="dark"] .tz-hint b{color:#C4B5FD}
.tz-next{margin:18px 0 8px}
/* 開場 */
.tz-in{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:480px;margin:0 auto}
.tz-in .tz-av{width:104px;height:104px;font-size:42px;margin:0 auto}
.tz-in h1{margin:0;text-align:center;font-size:26px;font-weight:800}.tz-in>p{margin:0;text-align:center;font-size:14.5px;line-height:1.7;color:var(--ink-2,#5F5A6B)}
.tz-in .card{padding:6px 16px!important}.tz-st{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line,#ECE8F2);font-size:14.5px}.tz-st:last-child{border-bottom:0}.tz-st em{font-style:normal;width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--violet-soft,#F1E8FF);font-size:17px}
html[data-theme="dark"] .tz-st em{background:rgba(167,139,250,.14)}
.tz-av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#B794FF,#FF8FC2)}
/* TIE 列表裡 LUMI 的頭貼 */
.t-av.tz-l{display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,#B794FF,#FF8FC2)}
.t-art .t-av.tz-l{font-size:15px}
.tz-st2{font-size:11.5px;margin:4px 4px 0;color:#C2185B}.tz-st2.p{color:var(--ink-3,#837D90)}
.t-me .t-col{display:flex;flex-direction:column;align-items:flex-end;max-width:70%}.t-me .t-col .t-b.me{max-width:100%}
.tz-sys{margin:6px auto 18px;max-width:86%;text-align:center;font-size:12px;line-height:1.7;color:var(--ink-3,#837D90);background:rgba(255,255,255,.7);border-radius:12px;padding:8px 14px}
html[data-theme="dark"] .tz-sys{background:rgba(255,255,255,.06)}
.tz-room .t-msgs{min-height:calc(100dvh - 120px)}
.tz-room .t-inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;padding:0 14px;color:inherit}
/* SNS 的貼文圖（漸層＋字） */
.tz-pic{position:relative;width:100%;aspect-ratio:4/5;display:grid;place-items:center;color:#fff;font:700 34px/1.15 "Playfair Display",serif;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.18);white-space:pre-line}
.sn-av.tz-av2 .dflt{background:linear-gradient(135deg,#B794FF,#FF8FC2)!important}
.sn-heart.go{animation:tryHeart .65s ease}@keyframes tryHeart{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* 打歌 */
.tz-win{display:none;margin:14px 0 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#FFF4D6,#FFE1EE);color:#5B3A00;font-size:13.5px;line-height:1.6}.tz-win b{display:block;font-size:16px;margin-bottom:2px}.tz-win.on{display:block;animation:tryPop .5s cubic-bezier(.2,.9,.3,1.3)}
html[data-theme="dark"] .tz-win{background:linear-gradient(135deg,rgba(255,200,80,.18),rgba(255,111,168,.16));color:#FFE7B0}
@keyframes tryPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* 應援棒 */
.tz-ls{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 16px 20px!important;background:radial-gradient(120% 90% at 50% 0%,#2A1F4A 0%,#120E1F 70%)!important;color:#fff;overflow:hidden}
.tz-stick{position:relative;width:120px;height:250px;border:0;background:none;padding:0;transform-origin:50% 92%;-webkit-tap-highlight-color:transparent}
.tz-stick .ball{position:absolute;left:50%;top:0;width:104px;height:104px;margin-left:-52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 0 30px var(--c),0 0 80px color-mix(in srgb,var(--c) 60%,transparent)}
.tz-stick .grip{position:absolute;left:50%;top:96px;width:22px;height:150px;margin-left:-11px;border-radius:11px;background:linear-gradient(90deg,#d9d6e3,#fff 40%,#bdb8cc)}
.tz-stick.wave{animation:tryWave .55s ease}@keyframes tryWave{25%{transform:rotate(-16deg)}60%{transform:rotate(12deg)}100%{transform:none}}
.tz-cols{display:flex;gap:12px}.tz-cols button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}.tz-cols button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.tz-ls p{margin:0;font-size:13px;color:rgba(255,255,255,.8)}
html[data-theme="dark"] .tz-room .t-inp{background:#2A2733!important;border-color:rgba(255,255,255,.08)!important}html[data-theme="dark"] .tz-room .t-inp input{color:#F1EEF7}
/* 結尾 */
.tz-end h2{margin:4px 0 6px;font-size:24px}.tz-end>p{margin:0 0 16px;color:var(--ink-2,#5F5A6B);line-height:1.7;font-size:14.5px}
.tz-end .card{padding:16px 18px!important;margin-bottom:12px}.tz-end .card h3{margin:0 0 6px;font-size:16px}.tz-end .card p,.tz-end .card li{font-size:13.5px;line-height:1.7;color:var(--ink-2,#5F5A6B)}.tz-end .card ol{margin:6px 0 0;padding-left:20px}
.tz-end .btn{text-decoration:none;display:flex;align-items:center;justify-content:center}
.tz-end .btn+.btn{margin-top:10px}

const hm=ts=>{ const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

function toast(t){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); if(layer.innerHTML){ el.style.bottom="auto"; el.style.top="calc(env(safe-area-inset-top,0px) + 14px)"; }
  el.innerHTML=`<i class="toast-ic" aria-hidden="true"></i><span>${esc(t)}</span>`; document.body.appendChild(el); setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),320); },2400); }

  const st=document.createElement("style"); st.id="appcss"; st.textContent=css; document.head.insertBefore(st,document.getElementById("trycss")); }catch(e){} document.documentElement.classList.add("ready"); })();

/* ---------- 後台（只有 TIE 用）：訊息放在 HAECHU 的媒體伺服器，訪客不用帳號 ---------- */
const TRY_API="https://haechu-media.vinriu715.workers.dev/try/";
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let MYID=LS.get("id",""); if(!/^[a-z0-9]{8,32}$/.test(MYID)){ MYID=(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^a-z0-9]/g,"").slice(0,24); LS.set("id",MYID); }
async function tapi(method,body){ const r=await fetch(TRY_API+MYID,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
const pull=()=>tapi("GET");
const push=local=>tapi("PUT",{nick:local.nick,msgs:local.msgs.filter(m=>m.from==="fan").slice(-20)});
function mergeMsgs(a,b){ const M=new Map(); [...(a||[]),...(b||[])].forEach(m=>{ if(m&&m.id) M.set(m.id,{...(M.get(m.id)||{}),...m}); }); return [...M.values()].sort((x,y)=>x.ts-y.ts); }

/* ---------- TIE（照 App 的 TIE：聊天室列表 → 聊天室） ---------- */
const WELCOME="嗨～我是 LUMI ✨\n這裡是只屬於我們的 TIE 💜\n跟我說說話吧！我看到就會回你～";
let CH=LS.get("chat",{nick:"",msgs:[]}), POLL=0;
const lumiAv=(cls="")=>`<div class="t-av tz-l ${cls}">L</div>`;
const tHeart=()=>`<span class="t-heart"><svg viewBox="0 0 24 24" width="15" height="15"><defs><radialGradient id="tryHG" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#D8B4FE"/><stop offset="50%" stop-color="#8843FB"/><stop offset="100%" stop-color="#8A2BE2"/></radialGradient></defs><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#tryHG)"/></svg><i></i></span>`;
function tieListHtml(){ const L=CH.msgs, last=L[L.length-1];
  return `<div class="t-glow" aria-hidden="true"></div><header class="t-lh sh-head"><div class="t-lh-side"></div><h1>TIE</h1><div class="t-lh-side r"><span class="tz-pill">試玩</span></div></header>
    <main class="t-list">${hint(`點 <b>${IDOL.name}</b> 的聊天室，跟她聊天。${IDOL.name} 是真人回覆的喔！`)}<span class="t-sec">最近的聊天室</span>
      <button class="t-room" data-go="room">${lumiAv("lg")}<div class="t-room-b"><div class="t-room-top"><span class="t-room-n"><b>${IDOL.name}</b></span><span class="t-room-t">${last?hm(last.ts):""}</span></div>
        <p>${last?(last.from==="fan"?"你：":"")+esc(last.text):"嗨～我是 LUMI ✨"}</p></div>${CH.unread?`<span class="t-cnt">${CH.unread}</span>`:""}</button></main>`; }
function roomHtml(){ const L=[{id:"w0",from:"idol",text:WELCOME,ts:CH.t0||Date.now()},...CH.msgs]; let lastDay="";
  const day=ts=>{ const d=new Date(ts), t=new Date(); return d.toDateString()===t.toDateString()?"今天":`${d.getMonth()+1}月${d.getDate()}日`; };
  const body=L.map((m,i)=>{ const d=day(m.ts); let sep=""; if(d!==lastDay){ sep=`<div class="t-day"><span>${d}</span></div>`; lastDay=d; }
    if(m.from==="fan") return sep+`<div class="t-me"><div class="t-meta"><span>${hm(m.ts)}</span></div><div class="t-col"><div class="t-b me">${esc(m.text)}</div>${m.pend?`<small class="tz-st2 p">傳送中…</small>`:m.fail?`<small class="tz-st2">還沒送出，會自動再傳</small>`:""}</div></div>`;
    return sep+`<div class="t-art">${lumiAv("ring")}<div class="t-art-c"><div class="t-art-n"><span class="t-badge" style="background:#8843FB">ARTIST</span><b>${IDOL.name}</b></div><div class="t-bw"><div class="t-b">${esc(m.text)}</div><span class="t-side"><span class="t-tm">${hm(m.ts)}</span></span></div></div></div>`; }).join("");
  return `<div class="tz-room"><div class="t-bgl t-default"></div><header class="t-rh sh-head"><div class="t-rh-row"><button class="t-ib" data-go="tie" aria-label="返回">${TI.back}</button><h3>${IDOL.name}</h3><div class="t-rh-r"></div></div>
      <div class="t-sub"><span class="t-sub-n">𝑇𝐼𝐸</span>${tHeart()}<span>+1</span></div></header>
    <main class="t-msgs" id="msgs">${body}${CH.msgs.length?`<p class="tz-sys">${IDOL.name} 是真人回覆的，可能要等一下下～可以先去玩別的，回來再看 💜</p>`:""}<div id="chat-end"></div></main>
    <form class="t-foot" id="tieF"><div class="t-inp"><input id="tieIn" maxlength="200" placeholder="${CH.nick?"":"先取一個暱稱再開始聊天"}" autocomplete="off" aria-label="輸入訊息"></div><button class="t-send" id="tieSend" type="submit" aria-label="送出">${TI.send}</button></form></div>`; }
function scrollMsgs(){ const e=document.getElementById("chat-end"); if(e) e.scrollIntoView({block:"end"}); }
function nickSheet(){ layer.innerHTML=`<div class="t-modal-w" data-close="1"><div class="t-modal" role="dialog" aria-label="你的暱稱"><h3>你的暱稱</h3><p>${IDOL.name} 在訊息裡會用這個名字叫你。</p><div class="t-mb"><input id="nickIn" class="t-wel-ta tpk-nk" maxlength="12" placeholder="輸入文字" autocomplete="off"><button class="t-mbtn main" id="nickOk">確認</button></div></div></div>`; setTimeout(()=>{ const i=document.getElementById("nickIn"); if(i) i.focus(); },60); }
async function sendMsg(text){ const m={id:"f"+rid(),from:"fan",text,ts:Date.now(),pend:1}; CH.msgs.push(m); if(!CH.t0) CH.t0=Date.now(); LS.set("chat",CH); render();
  try{ const v=await push({nick:CH.nick,ts:Date.now(),msgs:CH.msgs.map(x=>{ const o={...x}; delete o.pend; return o; })}); const ok=new Set((v.msgs||[]).map(x=>x.id)); CH.msgs=mergeMsgs(CH.msgs,v.msgs).map(x=>{ const o={...x}; delete o.pend; if(ok.has(o.id)) delete o.fail; else if(o.from==="fan"&&o.id===m.id) o.fail=1; return o; }); LS.set("chat",CH); render(); startPoll(); }
  catch(e){ m.pend=0; m.fail=1; LS.set("chat",CH); render(); toast("沒傳出去，等一下會自動重傳"); startPoll(); } }
async function resend(){ if(!CH.msgs.some(x=>x.fail)) return; try{ const v=await push({nick:CH.nick,ts:Date.now(),msgs:CH.msgs.map(x=>{ const o={...x}; delete o.pend; delete o.fail; return o; })}); CH.msgs=mergeMsgs(CH.msgs.map(x=>{ const o={...x}; delete o.fail; return o; }),v.msgs); LS.set("chat",CH); render(); }catch(e){} }
async function poll(){ if(document.hidden) return; await resend(); if(!CH.msgs.length) return; try{ const v=await pull(); if(!v) return; const before=CH.msgs.length; CH.msgs=mergeMsgs(CH.msgs,v.msgs).map(x=>{ const o={...x}; delete o.pend; return o; });
  if(CH.msgs.length!==before){ const n=CH.msgs.slice(before).filter(x=>x.from==="idol").length; if(n){ if(!(ST.tab==="tie"&&ST.room)) CH.unread=(CH.unread||0)+n; toast(`💜 ${IDOL.name} 回你了！`); } LS.set("chat",CH); render(); } }catch(e){} }
function startPoll(){ if(POLL) return; POLL=setInterval(poll,8000); }

/* ---------- 畫面 ---------- */
function done(k){ if(ST.done[k]) return; ST.done[k]=1; LS.set("done",ST.done); }
function render(){
  if(ST.tab==="intro"){ root.innerHTML=`<div class="app no-nav"><div class="tz-in"><span class="tz-av">L</span><h1>來當一次粉絲吧！</h1><p>這是 HAECHU 的試玩，不用帳號。<br>示範偶像 <b>${IDOL.name}</b> 會陪你玩一遍。</p>
    <section class="card">${[["💌",`收到 ${IDOL.name} 的 TIE，跟她聊天（真人回覆）`],["📸","滑她的 SNS，點兩下按愛心"],["🏆","幫她打歌，衝上一位"],["🪄","揮應援棒"]].map(([e,t])=>`<div class="tz-st"><em>${e}</em><span>${t}</span></div>`).join("")}</section>

  if(ST.tab==="tie"&&ST.room){ root.innerHTML=`<div class="app no-nav">${roomHtml()}</div>`; requestAnimationFrame(scrollMsgs); const i=document.getElementById("tieIn"); if(i&&ST.draft) i.value=ST.draft; return; }
  const body={tie:tieListHtml,sns:snsHtml,show:showHtml,ls:lsHtml,end:endHtml}[ST.tab]();
  root.innerHTML=`<div class="app">${body}</div>${navBar(ST.tab)}`; }
function go(k){ if(k==="room"){ ST.room=true; CH.unread=0; LS.set("chat",CH); render(); if(!CH.nick) setTimeout(nickSheet,280); return; }
  if(k==="tie"&&ST.room){ ST.room=false; render(); return; }
  ST.tab=k; ST.room=false; LS.set("tab",k); if(k==="end") done("end"); render(); window.scrollTo(0,0); }

document.addEventListener("click",e=>{ const t=e.target.closest("[data-go],[data-like],[data-vote],[data-col],[data-show],#stick,#nickOk,[data-close]"); if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.like) return like(t.dataset.like);
  if(t.dataset.show){ ST.showOpen=ST.showOpen===t.dataset.show?"_":t.dataset.show; render(); return; }
  if(t.dataset.vote){ if(ST.voted) return; ST.voted=true; done("show"); render(); toast("🏆 謝謝你的一票！"); return; }
  if(t.dataset.col){ ST.col=t.dataset.col; render(); return; }
  if(t.id==="stick"){ t.classList.remove("wave"); void t.offsetWidth; t.classList.add("wave"); ST.waves++; done("ls"); const c=document.getElementById("lsCnt"); if(c) c.textContent=`已經揮了 ${ST.waves} 下 💜`; if(navigator.vibrate) navigator.vibrate(20); return; }
  if(t.id==="nickOk"){ const v=(document.getElementById("nickIn").value||"").trim(); if(!v){ toast("先取一個暱稱"); return; } CH.nick=v; LS.set("chat",CH); layer.innerHTML=""; render(); setTimeout(()=>{ const i=document.getElementById("tieIn"); if(i) i.focus(); },50); return; }
  if(t.dataset.close&&e.target===t){ layer.innerHTML=""; return; } });
let lastTap={id:null,t:0};
document.addEventListener("pointerup",e=>{ const p=e.target.closest("[data-dbl]"); if(!p) return; const id=p.dataset.dbl, now=Date.now();
  if(lastTap.id===id&&now-lastTap.t<320){ lastTap={id:null,t:0}; const h=document.getElementById("hh-"+id); if(h){ h.classList.remove("go"); void h.offsetWidth; h.classList.add("go"); } setTimeout(()=>like(id,true),300); } else lastTap={id,t:now}; });
document.addEventListener("input",e=>{ if(e.target.id!=="tieIn") return; ST.draft=e.target.value; const b=document.getElementById("tieSend"); if(b) b.classList.toggle("on",!!e.target.value.trim()); });
document.addEventListener("submit",e=>{ if(e.target.id!=="tieF") return; e.preventDefault(); if(!CH.nick){ nickSheet(); return; } const i=document.getElementById("tieIn"), v=(i.value||"").trim(); if(!v) return; i.value=""; ST.draft=""; done("tie"); sendMsg(v); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
if(CH.msgs.length){ startPoll(); poll(); }
render();
</script>
</body>
</html>
