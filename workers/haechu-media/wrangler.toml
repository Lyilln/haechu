# HAECHU 照片／語音／影片 Worker（Cloudflare 的 haechu-media）
# Cloudflare → Workers → haechu-media → Settings → Build 連到這個 repo，Root directory 填 workers/haechu-media
name = "haechu-media"
main = "src/index.js"
compatibility_date = "2026-10-20"
keep_vars = true          # 保留在 Cloudflare 網頁上設定的 SUPABASE_URL、SUPABASE_KEY、ALLOWED_ORIGIN

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "haechu-media"
