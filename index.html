<style>/* 開場畫面：直接用 iPhone 啟動圖那張（字的位置、顏色一模一樣，接起來不會跳），上面加一點點光在動 */

#hcSplash .hs-glow{position:absolute;left:-20%;right:-20%;bottom:-10%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(246,240,255,.75),rgba(246,240,255,0));mix-blend-mode:screen;animation:hsGlow 2.4s ease-in-out infinite alternate}

@keyframes hsGlow{from{opacity:.35;transform:translateX(-5%)}to{opacity:.85;transform:translateX(5%)}}
@keyframes hsShine{from{background-position:120% 0}to{background-position:-20% 0}}
@media (prefers-reduced-motion:reduce){#hcSplash i{animation:none}}</style>
