<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>聊天室鍵盤測試</title>
<script>/* 跟 HAECHU 一樣的整體縮放，測起來才準 */(function(){var w=Math.min(innerWidth||390,screen.width||9999);var v=Math.max(.8,Math.min(.92,w/440));document.documentElement.style.zoom=v;})();</script>
<style>
:root{--violet:#8843FB;--bub:#A07CF8;--bg:#EEE7FF;--bar:#fff;--ink:#1F1B2E;--sub:#8E8A99;--line:#ECE7F7}
@media (prefers-color-scheme:dark){:root{--bg:#1B1A21;--bar:#323137;--ink:#F3F1F7;--sub:#A9A3B8;--line:#3A3842}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 1. 整頁鎖住，不讓 iPhone 自己把網頁推來推去 */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:-apple-system,"PingFang TC",system-ui,sans-serif;color:var(--ink)}
/* 2. 固定外殼：高度＝看得到的區域（還沒量到之前先用 100dvh），位置跟著 visualViewport 走 */
.app{position:fixed;left:0;right:0;top:0;height:var(--vvh,100dvh);transform:translateY(var(--vvt,0px));display:flex;flex-direction:column;background:var(--bg)}
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
.hd b{flex:1;text-align:center;font-size:17px}
.hd .md{display:flex;gap:4px}.hd .md a{padding:6px 12px;border-radius:999px;background:var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}.hd .md a.on{background:var(--violet);color:#fff}
/* 3. 只有訊息區自己捲 */
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 12px}
.inner{display:flex;flex-direction:column;gap:10px}
/* 辦法 A：倒過來排 → 瀏覽器自己讓它貼在最底 */
.mA .list{display:flex;flex-direction:column-reverse}
.m{max-width:74%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--bub);color:#fff;border-bottom-right-radius:5px}
.m.you{align-self:flex-start;background:var(--bar);border-bottom-left-radius:5px}
.m.stk{background:none;padding:0;font-size:72px;line-height:1}
.sep{align-self:center;font-size:12px;color:var(--sub)}
/* 4. 輸入列：一般排在最下面（不是 fixed），外殼變矮它就跟著上來 */
.bar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + var(--sab,env(safe-area-inset-bottom,0px)));background:var(--bar);border-top:1px solid var(--line)}
.kb .bar{--sab:0px}   /* 鍵盤開著時不用留 Home 橫條的空間 */
.bar button{flex:none;border:0;background:none;color:var(--violet);font-size:22px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.box{flex:1;min-width:0;position:relative;display:flex;border-radius:18px;background:var(--line)}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:16px;line-height:22px;padding:7px 14px;height:36px;max-height:calc(22px*8 + 14px);overflow-y:hidden;display:block}
textarea.scroll{overflow-y:auto}
/* 5. 貼圖區：在原本鍵盤的位置，也是外殼裡的一塊 */
.dock{flex:none;height:0;overflow:hidden;background:var(--bar);transition:height .18s ease}
.dk .dock{height:calc(260px + env(safe-area-inset-bottom,0px))}
.dock .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;font-size:44px;text-align:center}
.dock .g button{border:0;background:none;font-size:44px;padding:6px 0}
.dbg{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:9;background:#000b;color:#0f0;font:11px/1.4 monospace;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hd"><span style="width:84px"></span><b>鍵盤測試</b><span class="md"><a href="?m=a" id="ma">A</a><a href="?m=b" id="mb">B</a></span></header>
  <main class="list" id="list"><div class="inner" id="inner"></div></main>
  <form class="bar" id="bar"><button type="button" id="stkBtn" aria-label="貼圖">☺</button><span class="box"><textarea id="ta" rows="1" placeholder="輸入文字"></textarea></span><button type="submit" aria-label="送出">➤</button></form>
  <div class="dock" id="dock"><div class="g">💜🥹✨😭🫶🤍🎀🌙</div></div>
</div>
<div class="dbg" id="dbg" hidden></div>
<script>
const MODE=/[?&]m=b/.test(location.search)?"b":"a", app=document.getElementById("app"), list=document.getElementById("list"), inner=document.getElementById("inner"), ta=document.getElementById("ta"), dbg=document.getElementById("dbg");
document.documentElement.classList.add(MODE==="a"?"mA":"mB"); document.getElementById(MODE==="a"?"ma":"mb").classList.add("on");
if(/[?&]dbg/.test(location.search)) dbg.hidden=false;
const Z=()=>parseFloat(document.documentElement.style.zoom)||1;

/* 假訊息 */
const S=["今天好累喔","練習完了嗎？","剛剛吃了拉麵 🍜","明天要拍攝，早點睡","好想你們","這首歌一定要聽！","晚安～","大家今天過得好嗎？\n我今天去了海邊","哈哈哈哈哈","週末見"];

/* 「現在是不是在看最新的」：離最底 80 以內就算 */
const fromEnd=()=>MODE==="a"?Math.abs(list.scrollTop):list.scrollHeight-list.scrollTop-list.clientHeight;
const toEnd=()=>{ if(MODE==="a") list.scrollTop=0; else list.scrollTop=list.scrollHeight; };
let keep=null;   /* 辦法 B 用：變化前記住離最底多遠 */
const before=()=>{ if(MODE==="b"&&keep===null) keep=fromEnd(); };
const after=()=>{ if(MODE!=="b"||keep===null) return; const k=keep; keep=null; list.scrollTop=list.scrollHeight-list.clientHeight-(k<80?0:k); };

function add(text,who,scroll=true){ const d=document.createElement("div"); d.className="m "+who+(/^\p{Extended_Pictographic}$/u.test(text)?" stk":""); d.textContent=text;
  const near=fromEnd()<80; before(); inner.appendChild(d); if(scroll&&(near||who==="me")){ keep=null; requestAnimationFrame(toEnd); } else after(); }

for(let i=0;i<40;i++){ if(i%12===0){ const s=document.createElement("div"); s.className="sep"; s.textContent="— 第 "+(i/12+1)+" 天 —"; inner.appendChild(s); } add(S[i%S.length],i%3===0?"you":"me",false); }

/* ★ 核心：外殼高度＝visualViewport 高度，位置＝offsetTop（都要除以 App 的縮放） */
const vv=window.visualViewport;
function sync(){ if(!vv) return; before(); const z=Z(), h=vv.height/z, t=vv.offsetTop/z;
  app.style.setProperty("--vvh",h+"px"); app.style.setProperty("--vvt",t+"px");
  document.documentElement.classList.toggle("kb",vv.height<(screen.height||innerHeight)*0.75);
  requestAnimationFrame(after);
  if(!dbg.hidden) dbg.textContent=`模式 ${MODE.toUpperCase()}\nvv.h ${Math.round(vv.height)}  top ${Math.round(vv.offsetTop)}\ninner ${innerHeight}  zoom ${z.toFixed(3)}\n離最底 ${Math.round(fromEnd())}`; }
let raf=0; const q=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; sync(); }); };
if(vv){ vv.addEventListener("resize",q); vv.addEventListener("scroll",q); } addEventListener("resize",q); sync(); requestAnimationFrame(toEnd);
/* iPhone 會把整頁往上推：一律推回來（外殼已經自己跟著可視區了） */
addEventListener("scroll",()=>{ if(scrollY) scrollTo(0,0); q(); },{passive:true});

/* 輸入框：換行＝換行，越打越高，最多 8 行 */
function grow(){ before(); ta.style.height="auto"; const max=22*8+14, h=Math.min(ta.scrollHeight,max); ta.style.height=h+"px"; ta.classList.toggle("scroll",ta.scrollHeight>max+1); requestAnimationFrame(after); }
ta.addEventListener("input",grow);
document.getElementById("bar").addEventListener("submit",e=>{ e.preventDefault(); const v=ta.value.trim(); if(!v) return; ta.value=""; grow(); add(v,"me"); ta.focus();
  setTimeout(()=>add(["收到！","哈哈哈","真的嗎？","💜"][Math.random()*4|0],"you"),900); });

/* 貼圖區：按 ☺ 收鍵盤、等鍵盤收好再打開；點輸入框就換回鍵盤 */
const dkOn=()=>document.documentElement.classList.contains("dk");
document.getElementById("stkBtn").addEventListener("click",()=>{ if(dkOn()){ before(); document.documentElement.classList.remove("dk"); ta.focus(); setTimeout(after,200); return; }
  const wasKb=document.activeElement===ta; ta.blur(); setTimeout(()=>{ before(); document.documentElement.classList.add("dk"); setTimeout(after,200); },wasKb?320:0); });
ta.addEventListener("focus",()=>{ if(dkOn()){ before(); document.documentElement.classList.remove("dk"); setTimeout(after,200); } });
document.querySelector(".dock .g").innerHTML=[..."💜🥹✨😭🫶🤍🎀🌙"].filter(c=>c.trim()).map(c=>`<button type="button">${c}</button>`).join("");
document.querySelector(".dock .g").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) add(b.textContent,"me"); });
/* 訊息區上的動畫結束（貼圖區開合）時再對一次 */
document.getElementById("dock").addEventListener("transitionend",()=>{ if(MODE==="b"&&fromEnd()<120) toEnd(); });
</script>
</body>
</html>
